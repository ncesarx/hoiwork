name: Verify website

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hoiwork_test
          POSTGRES_PASSWORD: hoiwork_test
          POSTGRES_DB: hoiwork_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoiwork_test -d hoiwork_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://hoiwork_test:hoiwork_test@127.0.0.1:5432/hoiwork_test
      HOIWORK_TEST_DATABASE_URL: postgresql://hoiwork_test:hoiwork_test@127.0.0.1:5432/hoiwork_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter website db:generate
      - run: pnpm --filter website db:deploy
      - run: pnpm --filter website test
      - run: pnpm --filter website test:integration
      - run: pnpm --filter website typecheck
      - run: pnpm --filter website lint
      - run: pnpm --filter website build
