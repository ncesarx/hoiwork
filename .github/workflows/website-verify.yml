name: Verify website

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter website db:generate
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/hoiwork_ci
      - run: pnpm --filter website test
      - run: pnpm --filter website typecheck
      - run: pnpm --filter website lint
      - run: pnpm --filter website build
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/hoiwork_ci
